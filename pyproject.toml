[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "switchyard"
version = "0.1.0"
description = "Subscription-first engineering orchestration through stable 9router combos"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["9router", "codex", "opencode", "orchestration", "ai-agents"]
classifiers = [
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: Other/Proprietary License",
]
dependencies = [
  "fastapi>=0.115,<1",
  "langgraph>=0.2.50,<2",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "typer>=0.13,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
switchyard = "ninerouter_orchestrator.cli:app"
orchestrate = "ninerouter_orchestrator.cli:app"
orchestrate-ui = "ninerouter_orchestrator.web:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ninerouter_orchestrator"]
artifacts = ["src/ninerouter_orchestrator/web_assets/**"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
